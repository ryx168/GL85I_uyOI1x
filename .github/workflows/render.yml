name: Render AI 日报

# Builds the narration timing (edge-tts, with the committed mp3 cache as fallback),
# renders the HyperFrames composition to 1080p MP4 on a GitHub runner, and publishes
# the MP4 + a contact sheet as a workflow artifact and a GitHub Release (run-<number>).
# No secrets needed.

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  workflow_dispatch:
    inputs:
      quality:
        description: "Render quality"
        required: true
        default: high
        type: choice
        options: [draft, standard, high]

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUTF8: "1"
      HF: "npx --yes hyperframes@0.5.1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: System packages (ffmpeg + CJK fonts + headless-chrome libs)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra fonts-dejavu-core \
            libnss3 libatk-bridge2.0-0 libgbm1 libxkbcommon0 libasound2t64 libxcomposite1 libxrandr2 libxdamage1
          fc-cache -f >/dev/null
          echo "== CJK fonts"; fc-list | grep -i "Noto Sans CJK SC" | head -3
          ffmpeg -version | head -1

      - name: Python dependencies
        run: python -m pip install -q edge-tts

      - name: HyperFrames browser
        run: $HF browser ensure

      - name: Build narration timing + index.html
        run: |
          python build.py
          echo "== scene timing"; python -c "import json;d=json.load(open('timing.json',encoding='utf-8'));print('total',d['total'],'s');[print(s['id'],s['start'],s['dur']) for s in d['scenes']]"

      - name: Lint
        run: $HF lint

      - name: Render
        run: |
          mkdir -p renders
          $HF render --quality "${{ inputs.quality || 'high' }}" --workers 4 --output renders/ai-daily.mp4
          ls -la renders

      - name: Probe + contact sheet + review frames
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,r_frame_rate -of default=nw=1 renders/ai-daily.mp4
          mkdir -p frames
          ffmpeg -v error -y -i renders/ai-daily.mp4 -vf "fps=1/14,scale=480:-1,tile=4x3" -frames:v 1 renders/contact-sheet.jpg
          for t in 3 12 24 40 48 59 66 80 88 100 106 117 125 150 165; do
            ffmpeg -v error -y -ss $t -i renders/ai-daily.mp4 -frames:v 1 -vf scale=960:-1 frames/t$(printf %03d $t).jpg
          done
          ls frames

      - uses: actions/upload-artifact@v4
        with:
          name: ai-daily-${{ github.run_number }}
          path: |
            renders/ai-daily.mp4
            renders/contact-sheet.jpg
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: frames-${{ github.run_number }}
          path: frames/*.jpg
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="run-${{ github.run_number }}"
          gh release create "$tag" renders/ai-daily.mp4 renders/contact-sheet.jpg \
            --title "AI 日报 render $tag" \
            --notes "Rendered from ${{ github.sha }} at quality ${{ inputs.quality || 'high' }}."
